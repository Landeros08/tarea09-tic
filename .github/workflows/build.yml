name: Node Container
on: push
jobs:
  build-node:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - name: Check environment
        run: |
          echo "Running inside Docker"
          node --version
          npm --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run app
        run: node app.js
